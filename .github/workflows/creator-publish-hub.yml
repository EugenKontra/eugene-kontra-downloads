name: creator-publish-hub
on:
  push: { paths: ["creator-publish-hub/**"] }
  pull_request: { paths: ["creator-publish-hub/**"] }
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: creator-publish-hub } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: creator-publish-hub/package-lock.json }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx next build
