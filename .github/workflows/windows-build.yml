name: TuneWink 2.0 Windows build
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'downloads/TuneWink-v2.0.0-source.zip'
      - '.github/workflows/windows-build.yml'
  push:
    paths:
      - 'downloads/TuneWink-v2.0.0-source.zip'
      - '.github/workflows/windows-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Prepare source
        shell: pwsh
        run: |
          $unpackPath = Join-Path $env:RUNNER_TEMP 'tunewink-unpack'
          New-Item -ItemType Directory -Path $unpackPath -Force | Out-Null
          $archivePath = (Resolve-Path 'downloads/TuneWink-v2.0.0-source.zip').Path
          Write-Host "Extracting source archive: $archivePath"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::ExtractToDirectory($archivePath, $unpackPath, $true)
          $projectRoot = Join-Path $unpackPath 'TuneWink_2.0'
          $buildPath = Join-Path $projectRoot 'build-tunewink-release.ps1'
          if (!(Test-Path -LiteralPath $buildPath -PathType Leaf)) {
            Get-ChildItem -LiteralPath $unpackPath -Force | Format-Table Name,Mode,Length
            throw "TuneWink source archive is incomplete; missing $buildPath"
          }
          "TUNEWINK_ROOT=$projectRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build plugin and helper
        shell: pwsh
        run: '& (Join-Path $env:TUNEWINK_ROOT "build-tunewink-release.ps1")'
      - name: Build installer and retail package
        shell: pwsh
        run: '& (Join-Path $env:TUNEWINK_ROOT "installer/build-final-exes.ps1")'
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TuneWink-2.0.0-Windows-x64
          path: |
            ${{ runner.temp }}/tunewink-unpack/**/release/*.exe
            ${{ runner.temp }}/tunewink-unpack/**/release/*.zip
          if-no-files-found: error
          retention-days: 30
